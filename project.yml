# XcodeGen の設定。CI 上で `xcodegen generate` を実行すると TapStamp.xcodeproj が生成される。
# Mac で開発する場合も `brew install xcodegen && xcodegen generate` で同じプロジェクトが作れる。
name: TapStamp

options:
  bundleIdPrefix: com.loreclinic
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ja
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"

targets:
  TapStamp:
    type: application
    platform: iOS
    sources:
      - path: TapStamp
    info:
      path: TapStamp/Info.plist
      properties:
        CFBundleDisplayName: TapStamp
        CFBundleName: TapStamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loreclinic.tapstamp
        PRODUCT_NAME: TapStamp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: "YES"

  TapStampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TapStampTests
    dependencies:
      - target: TapStamp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loreclinic.tapstamp.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TapStamp:
    build:
      targets:
        TapStamp: all
        TapStampTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TapStampTests
    archive:
      config: Release
